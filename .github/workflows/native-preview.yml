name: Native Preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  swiftui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: python3 scripts/sync_native_design.py --check
      - run: cargo test --locked -p wisp-app -p wisp-service
      - run: swift test --package-path apps/macos --scratch-path target/native-macos/swift
      - run: bash scripts/build_native_macos.sh

  winui-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --locked -p wisp-app -p wisp-service
      - run: dotnet run --project apps/windows/Wisp.ProjectBrowser.ContractTests -- contracts/project-browser/v1/projects.json
